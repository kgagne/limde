<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Open Sans (APT fonts-open-sans) is the desktop's sans-serif. Serif and
     monospace keep their defaults; glyphs Open Sans lacks fall back as usual. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Open Sans</family>
    </prefer>
  </alias>
</fontconfig>
