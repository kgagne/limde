// agent-web: the web agent's page stays in this window; other links open in the main Firefox.
// Firefox autoconfig, loaded by every profile of this Firefox install; it does nothing outside
// the agent-web profile. The first line of this file must stay a comment.
//
// agent-web passes its settings as prefs (written into the profile's user.js on launch):
//   limde.agentweb.home  the page the window opens on ("" = not set up yet)
//   limde.agentweb.keep  space-separated domains that stay in the window
//   limde.agentweb.conf  where to save what the first session learns
// Not set up yet ("learning"): the window may go anywhere, so you can sign in however your
// agent wants. The first site it lands on becomes home, and every domain the page visits
// during that session is kept. From the next start, only those domains stay in the window.
try {
  const HOME = Services.env.get("HOME");
  const PROFILE = HOME + "/.local/share/agent-web/profile";
  const LOG = HOME + "/.local/state/limde/agent-web.log";

  if (Services.dirsvc.get("ProfD", Ci.nsIFile).path === PROFILE) {
    const prefs = Services.prefs;
    const homeUrl = prefs.getStringPref("limde.agentweb.home", "");
    const confPath = prefs.getStringPref("limde.agentweb.conf", "");
    const keep = new Set(prefs.getStringPref("limde.agentweb.keep", "").split(/\s+/).filter(Boolean));
    const learning = homeUrl === "";
    // Sign-in providers stay in the window, so logging in with them works.
    const SIGN_IN = /^(accounts\.google\.com|appleid\.apple\.com|login\.microsoftonline\.com|login\.live\.com|github\.com)$/;
    const { STATE_START, STATE_IS_DOCUMENT } = Ci.nsIWebProgressListener;

    // IOUtils is not available in the autoconfig scope.
    const writeFile = (path, text, append) => {
      const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      file.initWithPath(path);
      const out = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
      out.init(file, 0x02 | 0x08 | (append ? 0x10 : 0x20), 0o644, 0); // write, create, append|truncate
      out.write(text, text.length);
      out.close();
    };
    const log = message => {
      try {
        writeFile(LOG, new Date().toISOString() + " " + message + "\n", true);
      } catch (e) {}
    };
    const baseDomain = host => {
      try {
        return Services.eTLD.getBaseDomainFromHost(host);
      } catch (e) {
        return host;
      }
    };
    if (homeUrl) {
      try {
        keep.add(baseDomain(Services.io.newURI(homeUrl).host));
      } catch (e) {}
    }
    const kept = host => keep.has(host) || keep.has(baseDomain(host));

    let learnedHome = null;
    const remember = uri => {
      if (!learning || !confPath) {
        return;
      }
      keep.add(baseDomain(uri.host));
      learnedHome = learnedHome || uri.prePath + uri.filePath;
      try {
        writeFile(confPath, "# Written by agent-web while you signed in; edit or run \"agent-web reset\".\n" +
          "url=" + learnedHome + "\nkeep=" + [...keep].join(" ") + "\n", false);
      } catch (e) {
        log("could not save " + confPath + ": " + e);
      }
    };

    const openInMain = url => {
      const firefox = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      firefox.initWithPath(HOME + "/.local/bin/firefox");
      const process = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
      process.init(firefox);
      process.runAsync(["--name", "firefox", url], 3);
    };

    let home = null;
    const watch = win => {
      const gBrowser = win.gBrowser;
      if (!gBrowser) {
        return;
      }
      // The first tab of the first window is the agent's page.
      if (!home) {
        home = gBrowser.tabs[0].linkedBrowser;
      }
      // No keyboard close or quit: Ctrl+W, Ctrl+Shift+W, Ctrl+Q.
      for (const id of ["key_close", "key_closeWindow", "key_quitApplication"]) {
        win.document.getElementById(id)?.remove();
      }
      gBrowser.addTabsProgressListener({
        onStateChange(browser, progress, request, flags) {
          if (!progress.isTopLevel || !(flags & STATE_START) || !(flags & STATE_IS_DOCUMENT)) {
            return;
          }
          let uri;
          try {
            uri = request.QueryInterface(Ci.nsIChannel).URI;
          } catch (e) {
            return;
          }
          if (uri.scheme !== "http" && uri.scheme !== "https") {
            return;
          }
          if (SIGN_IN.test(uri.host)) {
            return;
          }
          if (browser === home && (learning || kept(uri.host))) {
            remember(uri);
            return;
          }
          // Remote tabs report a request proxy that may not support cancel.
          try {
            request.cancel(Cr.NS_BINDING_ABORTED);
          } catch (e) {}
          browser.stop();
          openInMain(uri.spec);
          log("to main Firefox: " + uri.prePath);
          if (browser !== home) {
            const tab = gBrowser.getTabForBrowser(browser);
            win.setTimeout(() => tab && gBrowser.removeTab(tab), 0);
          }
        },
      });
    };

    Services.obs.addObserver(win => {
      try {
        watch(win);
      } catch (e) {
        log("watch: " + e);
      }
    }, "browser-delayed-startup-finished");
    log(learning ? "loaded (learning: not set up yet)" : "loaded, home " + homeUrl);
  }
} catch (e) {
  Cu.reportError(e);
}
