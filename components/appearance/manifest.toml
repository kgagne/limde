# Template -> file in your home folder, rendered by limde-appearance.

[[files]]
template = "tinybar.css.in"
destination = ".config/tinybar/style.css"

[[files]]
template = "walker.css.in"
destination = ".config/walker/themes/limde/style.css"

[[files]]
template = "pcmanfm.css.in"
destination = ".local/share/themes/LimDE-Panel/gtk-3.0/gtk.css"

[[files]]
template = "labwc.themerc.in"
destination = ".local/share/themes/limde/labwc/themerc"

[[files]]
template = "labwc-override.in"
destination = ".config/labwc/themerc-override"

[[files]]
template = "gtk3-settings.ini.in"
destination = ".config/gtk-3.0/settings.ini"

[[files]]
template = "gtk4-settings.ini.in"
destination = ".config/gtk-4.0/settings.ini"

[[files]]
template = "mako.conf.in"
destination = ".config/mako/config"

[[files]]
template = "gtk3-desktop.css.in"
destination = ".local/share/themes/LimDE/gtk-3.0/gtk.css"

[[files]]
template = "gtk4-desktop.css.in"
destination = ".local/share/themes/LimDE/gtk-4.0/gtk.css"

[[files]]
template = "gtk4-user.css.in"
destination = ".config/gtk-4.0/gtk.css"

[[files]]
template = "gtk-dark.css.in"
destination = ".local/share/themes/LimDE/gtk-3.0/gtk-dark.css"

[[files]]
template = "gtk-dark.css.in"
destination = ".local/share/themes/LimDE/gtk-4.0/gtk-dark.css"

# Title-bar buttons: labwc takes NAME-active.svg and NAME-inactive.svg before the
# one-bit .xbm masks in /usr/local/share/themes/limde/labwc, which stay as the fallback.
# fill names the palette colour each file is drawn in (the template's ${fill}).

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/close-active.svg"
fill = "button_close"

[[files]]
template = "labwc-button-close.svg.in"
destination = ".local/share/themes/limde/labwc/close_hover-active.svg"
fill = "button_close"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/close-inactive.svg"
fill = "button_inactive"

[[files]]
template = "labwc-button-close.svg.in"
destination = ".local/share/themes/limde/labwc/close_hover-inactive.svg"
fill = "button_inactive"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/iconify-active.svg"
fill = "button_iconify"

[[files]]
template = "labwc-button-iconify.svg.in"
destination = ".local/share/themes/limde/labwc/iconify_hover-active.svg"
fill = "button_iconify"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/iconify-inactive.svg"
fill = "button_inactive"

[[files]]
template = "labwc-button-iconify.svg.in"
destination = ".local/share/themes/limde/labwc/iconify_hover-inactive.svg"
fill = "button_inactive"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/max-active.svg"
fill = "button_maximize"

[[files]]
template = "labwc-button-max.svg.in"
destination = ".local/share/themes/limde/labwc/max_hover-active.svg"
fill = "button_maximize"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/max-inactive.svg"
fill = "button_inactive"

[[files]]
template = "labwc-button-max.svg.in"
destination = ".local/share/themes/limde/labwc/max_hover-inactive.svg"
fill = "button_inactive"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/max_toggled-active.svg"
fill = "button_maximize"

[[files]]
template = "labwc-button-max.svg.in"
destination = ".local/share/themes/limde/labwc/max_toggled_hover-active.svg"
fill = "button_maximize"

[[files]]
template = "labwc-button.svg.in"
destination = ".local/share/themes/limde/labwc/max_toggled-inactive.svg"
fill = "button_inactive"

[[files]]
