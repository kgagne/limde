# foot settings for the agent window in CLI mode only (agent-cli passes it with -c).
# To change them, copy this file to ~/.config/limde/agent-cli/foot.ini, which is then
# used instead.
font=JetBrains Mono:size=11
pad=10x8 center
# The same size as agent-web's first window.
initial-window-size-pixels=1100x780

# tmux keeps the scrollback (50 000 lines, mouse wheel); foot needs none of its own.
[scrollback]
lines=0

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes
