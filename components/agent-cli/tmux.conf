# tmux settings for the CLI agent's session (socket "agent"), read when
# limde-agent-cli.service starts it. Your own additions go in
# ~/.config/limde/agent-cli/tmux.conf, read last; apply a change without a restart with
#   tmux -L agent source-file /usr/local/share/limde/agent-cli/tmux.conf

# Mouse: the wheel scrolls the agent's output, a drag selects and copies.
set -g mouse on
# Long agent sessions scroll past tmux's 2000-line default. foot keeps no scrollback in
# this window; this is the one.
set -g history-limit 50000
# Keys tmux would otherwise flatten, such as Shift+Enter (a new line in most CLI agents).
set -s extended-keys on
# foot's colours, cursor shapes, clipboard and focus reports pass through.
set -s default-terminal "tmux-256color"
set -as terminal-features 'foot*:RGB:clipboard:cstyle:extkeys:focus:hyperlinks:sync'
set -s set-clipboard on
# The agent learns when its window is in front.
set -g focus-events on
# Esc reaches the agent at once (most CLI agents stop their current step on Esc).
set -s escape-time 10

# The window shows one tmux window, and the status line lists none: a new one would hide
# the agent with no way back in sight, and closing its pane would end the agent. So the
# keys for a new window and for killing a pane or window do nothing here, as Ctrl+T and
# Ctrl+W do nothing in agent-web. tmux's command prompt (Ctrl+B :) still does anything.
unbind-key c
unbind-key x
unbind-key &
# Also off: moving a pane to a window of its own (!), renaming the session ($; the window
# finds it by name), the session and window trees (s, w), whose x kills, and the pane and
# window menus (<, >).
unbind-key !
unbind-key '$'
unbind-key s
unbind-key w
unbind-key <
unbind-key >
# The right-click menus offer Kill, New Window and Rename too. Unbound, a right click goes
# to the agent, as it does when the agent asks for the mouse.
unbind-key -n MouseDown3Pane
unbind-key -n M-MouseDown3Pane
unbind-key -n MouseDown3Status
unbind-key -n M-MouseDown3Status
unbind-key -n MouseDown3StatusLeft
unbind-key -n M-MouseDown3StatusLeft

# One quiet status line: the agent's name (agent-cli --run sets @agent).
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g status-left " #{?@agent,#{@agent},agent} "
set -g status-left-length 40
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""

source-file -q "$HOME/.config/limde/agent-cli/tmux.conf"
